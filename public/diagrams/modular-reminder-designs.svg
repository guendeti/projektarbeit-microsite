<svg xmlns="http://www.w3.org/2000/svg" width="860" height="306" viewBox="0 0 860 306" role="img" aria-labelledby="title desc">
  <title id="title">Two ways for a reminder to get contact details</title>
  <desc id="desc">In the first design, the reminder fetches an owner record and reads its contact fields. In the second, it calls a contact lookup and the owner module retrieves the details from its own storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#42566b"/>
    </marker>
  </defs>
  <rect width="860" height="306" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#172638">
    <g fill="#fbfcfd" stroke="#94a4b6">
      <rect x="12" y="12" width="410" height="282" rx="6"/>
      <rect x="438" y="12" width="410" height="282" rx="6"/>
    </g>
    <g font-size="19" font-weight="bold">
      <text x="217" y="46" text-anchor="middle">Read the owner record</text>
      <text x="643" y="46" text-anchor="middle">Ask for contact details</text>
    </g>

    <g fill="#eaf1f8" stroke="#42566b">
      <rect x="61" y="64" width="312" height="63" rx="4"/>
      <rect x="487" y="64" width="312" height="63" rx="4"/>
    </g>
    <g fill="#fff5dc" stroke="#42566b">
      <rect x="61" y="186" width="312" height="63" rx="4"/>
      <rect x="487" y="186" width="312" height="63" rx="4"/>
    </g>
    <g font-size="16" text-anchor="middle">
      <text x="217" y="90" font-weight="bold">Reminder</text>
      <text x="217" y="111">Reads contact fields from the record</text>
      <text x="643" y="90" font-weight="bold">Reminder</text>
      <text x="643" y="111">Uses the contact details it receives</text>
      <text x="217" y="212" font-weight="bold">Owner module</text>
      <text x="217" y="233">Returns the owner record</text>
      <text x="643" y="212" font-weight="bold">Owner module</text>
      <text x="643" y="233">Finds and returns the contact details</text>
    </g>
    <g fill="none" stroke="#42566b" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M217 127 V186"/>
      <path d="M643 127 V186"/>
    </g>
    <g font-size="15" fill="#35495e">
      <text x="228" y="161">Load owner</text>
      <text x="654" y="161">Look up contacts</text>
      <text x="217" y="275" text-anchor="middle">The reminder knows the record structure.</text>
      <text x="643" y="275" text-anchor="middle">The owner module knows where the details live.</text>
    </g>
  </g>
</svg>
