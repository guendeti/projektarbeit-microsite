<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Package dependencies in Spring PetClinic</title>
  <desc id="desc">Four direct subpackages are shown. The owner module holds owners, pets and visits. The vet module holds the vet directory. Both depend on the model module with shared base classes. The system package imports none of the other three.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#24364a"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#172638">
    <text x="24" y="32" font-size="20" font-weight="bold">Package dependencies in Spring PetClinic</text>

    <rect x="20" y="55" width="920" height="335" rx="6" fill="#ffffff" stroke="#42566b" stroke-width="2"/>
    <text x="40" y="82" font-size="16" font-weight="bold">Original Spring PetClinic application</text>

    <rect x="45" y="100" width="270" height="140" rx="5" fill="#fff5dc" stroke="#42566b" stroke-width="1.5"/>
    <text x="180" y="130" font-size="16" text-anchor="middle" font-weight="bold">owner</text>
    <text x="180" y="156" font-size="14" text-anchor="middle">Owner, Pet, Visit</text>
    <text x="180" y="178" font-size="14" text-anchor="middle">Visit booking</text>

    <rect x="345" y="100" width="270" height="140" rx="5" fill="#fff5dc" stroke="#42566b" stroke-width="1.5"/>
    <text x="480" y="130" font-size="16" text-anchor="middle" font-weight="bold">vet</text>
    <text x="480" y="156" font-size="14" text-anchor="middle">Vet directory</text>

    <rect x="645" y="100" width="270" height="140" rx="5" fill="#f7f7f7" stroke="#42566b" stroke-width="1.5"/>
    <text x="780" y="130" font-size="16" text-anchor="middle" font-weight="bold">system</text>
    <text x="780" y="156" font-size="14" text-anchor="middle">Web configuration and caching</text>
    <text x="780" y="178" font-size="14" text-anchor="middle">Welcome and error handling</text>

    <rect x="195" y="300" width="270" height="70" rx="5" fill="#f7f7f7" stroke="#42566b" stroke-width="1.5"/>
    <text x="330" y="328" font-size="16" text-anchor="middle" font-weight="bold">model</text>
    <text x="330" y="352" font-size="14" text-anchor="middle">BaseEntity, NamedEntity, Person</text>

    <g fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M180 240 L280 300"/>
      <path d="M480 240 L380 300"/>
    </g>

    <text x="24" y="422" font-size="14">Each arrow points from a package to another package it imports.</text>
    <text x="24" y="444" font-size="14">Both owner and vet use shared model classes. Neither imports the other.</text>
  </g>
</svg>
