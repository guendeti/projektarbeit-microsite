<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Community PetClinic Microservices variant</title><desc id="desc">Browser uses a gateway. Customers, Visits and Vets are separate applications with separate persistence models.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker></defs>
<rect width="960" height="440" fill="white"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#111">
<text x="24" y="30" font-size="20" font-weight="bold">Community PetClinic Microservices variant</text>
<rect x="25" y="80" width="160" height="70" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="105.0" y="106" text-anchor="middle">Browser</text>
<rect x="300" y="80" width="600" height="70" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="600.0" y="106" text-anchor="middle">API gateway / shared entry</text>
<rect x="30" y="250" width="260" height="80" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="160.0" y="276" text-anchor="middle">Customers service</text>
<text x="160.0" y="299" text-anchor="middle">Owner and Pet model</text>
<rect x="350" y="250" width="260" height="80" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="480.0" y="276" text-anchor="middle">Visits service</text>
<text x="480.0" y="299" text-anchor="middle">Visit model + petId</text>
<rect x="670" y="250" width="260" height="80" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="800.0" y="276" text-anchor="middle">Vets service</text>
<text x="800.0" y="299" text-anchor="middle">Vet model</text>
<path d="M185 115 L300 115" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="242.5" y="105.0" text-anchor="middle" font-size="14">HTTP</text>
<path d="M430 150 L160 250" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="295.0" y="190.0" text-anchor="middle" font-size="14">HTTP</text>
<path d="M600 150 L480 250" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="540.0" y="190.0" text-anchor="middle" font-size="14">HTTP</text>
<path d="M770 150 L800 250" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="785.0" y="190.0" text-anchor="middle" font-size="14">HTTP</text>
<text x="24" y="396" font-size="14">Boxes represent separate applications with separate persistence models.</text>
<text x="24" y="418" font-size="14">Supporting services are omitted. See the pinned Compose configuration.</text>
</g></svg>
