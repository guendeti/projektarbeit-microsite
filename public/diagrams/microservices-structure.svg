<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Proposed split of Spring PetClinic into microservices</title>
  <desc id="desc">A browser talks to an API gateway, which routes requests to an Owners, a Visits and a Vets service and can combine their responses. Each service has its own database and its own pages, and each is owned by one team. During booking, the Visits service calls the Owners service over HTTP to check that the pet belongs to the owner. This is a proposed design, not an implementation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#24364a"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#172638">
    <text x="24" y="32" font-size="20" font-weight="bold">Proposed split of Spring PetClinic into microservices</text>

    <rect x="30" y="70" width="160" height="70" rx="5" fill="#f7f7f7" stroke="#42566b" stroke-width="1.5"/>
    <text x="110" y="111" font-size="16" text-anchor="middle">Browser</text>

    <rect x="260" y="65" width="480" height="80" rx="5" fill="#eaf2fb" stroke="#42566b" stroke-width="1.5"/>
    <text x="500" y="96" font-size="16" text-anchor="middle" font-weight="bold">API gateway</text>
    <text x="500" y="120" font-size="14" text-anchor="middle">routes requests and can combine responses</text>

    <g fill="none" stroke="#42566b" stroke-width="1.4" stroke-dasharray="7 5">
      <rect x="25" y="200" width="300" height="270" rx="8"/>
      <rect x="350" y="200" width="300" height="270" rx="8"/>
      <rect x="675" y="200" width="300" height="270" rx="8"/>
    </g>
    <text x="45" y="224" font-size="14" font-style="italic">Owners team</text>
    <text x="370" y="224" font-size="14" font-style="italic">Visits team</text>
    <text x="860" y="224" font-size="14" font-style="italic">Vets team</text>

    <g fill="#fff5dc" stroke="#42566b" stroke-width="1.5">
      <rect x="50" y="240" width="250" height="100" rx="5"/>
      <rect x="375" y="240" width="250" height="100" rx="5"/>
      <rect x="700" y="240" width="250" height="100" rx="5"/>
    </g>
    <text x="175" y="270" font-size="16" text-anchor="middle" font-weight="bold">Owners service</text>
    <text x="175" y="294" font-size="14" text-anchor="middle">owner and pet pages</text>
    <text x="175" y="316" font-size="14" text-anchor="middle">owner and pet API</text>
    <text x="500" y="270" font-size="16" text-anchor="middle" font-weight="bold">Visits service</text>
    <text x="500" y="294" font-size="14" text-anchor="middle">booking form and visit history</text>
    <text x="500" y="316" font-size="14" text-anchor="middle">visit API</text>
    <text x="825" y="270" font-size="16" text-anchor="middle" font-weight="bold">Vets service</text>
    <text x="825" y="294" font-size="14" text-anchor="middle">vet list page</text>
    <text x="825" y="316" font-size="14" text-anchor="middle">vet API</text>

    <g fill="#eaf2fb" stroke="#42566b" stroke-width="1.5">
      <rect x="100" y="385" width="150" height="60" rx="5"/>
      <rect x="425" y="385" width="150" height="60" rx="5"/>
      <rect x="750" y="385" width="150" height="60" rx="5"/>
    </g>
    <text x="175" y="420" font-size="14" text-anchor="middle">Owners database</text>
    <text x="500" y="412" font-size="14" text-anchor="middle">Visits database</text>
    <text x="500" y="432" font-size="12" text-anchor="middle">visit records</text>
    <text x="825" y="420" font-size="14" text-anchor="middle">Vets database</text>

    <g fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M190 105 H260"/>
      <path d="M380 145 L200 240"/>
      <path d="M500 145 V240"/>
      <path d="M620 145 L800 240"/>
      <path d="M375 300 H300"/>
      <path d="M175 340 V385"/>
      <path d="M500 340 V385"/>
      <path d="M825 340 V385"/>
    </g>
    <rect x="304" y="278" width="67" height="16" fill="white"/>
    <rect x="304" y="305" width="67" height="15" fill="white"/>
    <text x="337" y="291" font-size="12" text-anchor="middle">check pet</text>
    <text x="337" y="316" font-size="12" text-anchor="middle">at booking</text>

    <text x="24" y="510" font-size="14">Solid arrows are HTTP calls and database access at runtime. Dashed frames mark the team that owns a service,</text>
    <text x="24" y="532" font-size="14">including its pages. Our own design based on the official Spring PetClinic, not implemented.</text>
  </g>
</svg>
