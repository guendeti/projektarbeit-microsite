<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Layered variant: booking through a service layer</title>
  <desc id="desc">LayeredVisitController in the presentation layer uses VisitService in the business layer. VisitService uses OwnerRepository in the data access layer. The controller also holds the repository for loading pet and owner details through VisitFormModel.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#24364a"/>
    </marker>
  </defs>
  <rect width="960" height="320" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#172638">
    <text x="24" y="32" font-size="20" font-weight="bold">Layered variant: booking through a service layer</text>

    <text x="160" y="78" font-size="14" text-anchor="middle" font-style="italic">Presentation layer</text>
    <text x="480" y="78" font-size="14" text-anchor="middle" font-style="italic">Business layer</text>
    <text x="800" y="78" font-size="14" text-anchor="middle" font-style="italic">Data access layer</text>

    <rect x="25" y="90" width="270" height="90" rx="5" fill="#eaf2fb" stroke="#42566b" stroke-width="1.5"/>
    <text x="160" y="128" font-size="16" text-anchor="middle" font-weight="bold">LayeredVisitController</text>
    <text x="160" y="152" font-size="14" text-anchor="middle">reads the form, shows errors</text>

    <rect x="345" y="90" width="270" height="90" rx="5" fill="#fff5dc" stroke="#42566b" stroke-width="1.5"/>
    <text x="480" y="128" font-size="16" text-anchor="middle" font-weight="bold">VisitService</text>
    <text x="480" y="152" font-size="14" text-anchor="middle">checks the date and pet</text>

    <rect x="665" y="90" width="270" height="90" rx="5" fill="#eaf2fb" stroke="#42566b" stroke-width="1.5"/>
    <text x="800" y="128" font-size="16" text-anchor="middle" font-weight="bold">OwnerRepository</text>
    <text x="800" y="152" font-size="14" text-anchor="middle">loads and saves owners</text>

    <g fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M295 135 H345"/>
      <path d="M615 135 H665"/>
      <path d="M160 180 V236 H800 V181" stroke-dasharray="7 5"/>
    </g>
    <text x="320" y="125" font-size="13" text-anchor="middle">uses</text>
    <text x="640" y="125" font-size="13" text-anchor="middle">uses</text>

    <text x="480" y="222" font-size="15" text-anchor="middle">passes the repository to VisitFormModel for form display</text>
    <text x="24" y="289" font-size="14">Solid arrows show booking dependencies. The dashed arrow shows the additional dependency for displaying the form.</text>
  </g>
</svg>
