<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Our Layered design separates responsibilities</title><desc id="desc">Controller uses booking service, which uses repository and independent policy. JPA model is shared.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker></defs>
<rect width="960" height="440" fill="white"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#111">
<text x="24" y="30" font-size="20" font-weight="bold">Our Layered design separates responsibilities</text>
<rect x="25" y="85" width="250" height="80" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="150.0" y="111" text-anchor="middle">Presentation</text>
<text x="150.0" y="134" text-anchor="middle">VisitController</text>
<rect x="355" y="85" width="260" height="80" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="485.0" y="111" text-anchor="middle">Application service</text>
<text x="485.0" y="134" text-anchor="middle">VisitBookingService</text>
<rect x="695" y="85" width="240" height="80" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="815.0" y="111" text-anchor="middle">Data access</text>
<text x="815.0" y="134" text-anchor="middle">OwnerRepository</text>
<rect x="355" y="270" width="260" height="80" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="485.0" y="296" text-anchor="middle">VisitRules</text>
<text x="485.0" y="319" text-anchor="middle">Independent policy</text>
<rect x="695" y="270" width="240" height="80" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="815.0" y="296" text-anchor="middle">Owner / Pet / Visit</text>
<text x="815.0" y="319" text-anchor="middle">Shared JPA model</text>
<path d="M275 125 L355 125" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="315.0" y="115.0" text-anchor="middle" font-size="14">uses</text>
<path d="M615 125 L695 125" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="655.0" y="115.0" text-anchor="middle" font-size="14">uses</text>
<path d="M485 165 L485 270" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="485.0" y="207.5" text-anchor="middle" font-size="14">uses</text>
<path d="M815 165 L815 270" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="815.0" y="207.5" text-anchor="middle" font-size="14">uses</text>
<text x="24" y="396" font-size="14">Arrows show selected type references. Controller and service also use shared model types.</text>
<text x="24" y="418" font-size="14">Shared model types make this a relaxed layered design, not strict adjacent-layer access.</text>
</g></svg>
