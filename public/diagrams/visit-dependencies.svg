<path d="M815 170 L815 240" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="815.0" y="195.0" text-anchor="middle" font-size="14">contains</text>
<path d="M700 275 L610 275" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="655.0" y="265.0" text-anchor="middle" font-size="14">contains</text>
<text x="24" y="396" font-size="14">Arrows show source code dependencies and model relationships, not runtime order.</text>
<text x="24" y="418" font-size="14">Controller also uses Owner and Pet. Base classes are omitted. Own diagram of the pinned source code.</text>
</g></svg>
