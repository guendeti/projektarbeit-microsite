<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Dependencies in the original Spring PetClinic</title><desc id="desc">Controller uses repository and model types. Owner contains Pets, and Pet contains Visits. Repository extends JpaRepository.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker></defs>
<rect width="960" height="440" fill="white"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#111">
<text x="24" y="30" font-size="20" font-weight="bold">Dependencies in the original Spring PetClinic</text>
<rect x="25" y="90" width="260" height="80" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="155.0" y="116" text-anchor="middle">VisitController</text>
<text x="155.0" y="139" text-anchor="middle">Spring MVC</text>
<rect x="370" y="90" width="240" height="80" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="490.0" y="116" text-anchor="middle">OwnerRepository</text>
<text x="490.0" y="139" text-anchor="middle">extends JpaRepository</text>
<rect x="700" y="90" width="230" height="80" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="815.0" y="116" text-anchor="middle">Owner</text>
<text x="815.0" y="139" text-anchor="middle">JPA entity</text>
<rect x="700" y="240" width="230" height="70" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="815.0" y="266" text-anchor="middle">Pet</text>
<text x="815.0" y="289" text-anchor="middle">JPA entity</text>
<rect x="370" y="240" width="240" height="70" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="490.0" y="266" text-anchor="middle">Visit</text>
<text x="490.0" y="289" text-anchor="middle">JPA + validation</text>
<path d="M285 130 L370 130" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="327.5" y="120.0" text-anchor="middle" font-size="14">uses</text>
<path d="M610 130 L700 130" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="655.0" y="120.0" text-anchor="middle" font-size="14">Owner type</text>
<path d="M285 155 L370 265" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
