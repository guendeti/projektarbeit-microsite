<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">One proposed clinic system at two levels</title>
  <desc id="desc">At the system level, a browser calls one clinic application, which accesses a data store. A closer view inside the same application shows a web controller calling a booking operation, which calls a persistence adapter. Solid arrows represent runtime interactions. The dashed arrow indicates a closer view.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#222"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="24" y="31" font-size="20" font-weight="bold">One proposed clinic system at two levels</text>

    <rect x="225" y="66" width="710" height="145" rx="6" fill="#f4f8fd" stroke="#426b99" stroke-width="1.5"/>
    <text x="245" y="90" font-size="16" font-weight="bold">System level</text>
    <rect x="25" y="116" width="160" height="65" rx="4" fill="#f7f7f7" stroke="#333"/>
    <text x="105" y="154" text-anchor="middle" font-size="16">Browser</text>
    <rect x="265" y="116" width="300" height="65" rx="4" fill="white" stroke="#333"/>
    <text x="415" y="154" text-anchor="middle" font-size="16">Clinic application</text>
    <rect x="700" y="116" width="195" height="65" rx="4" fill="white" stroke="#333"/>
    <text x="797.5" y="154" text-anchor="middle" font-size="16">Data store</text>
    <path d="M185 148 L265 148" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="225" y="138" text-anchor="middle" font-size="13">HTTP</text>
    <path d="M565 148 L700 148" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="632.5" y="138" text-anchor="middle" font-size="13">read/write</text>

    <path d="M415 181 L415 255" fill="none" stroke="#426b99" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="430" y="236" font-size="13">zoom inside</text>

    <rect x="25" y="255" width="910" height="130" rx="6" fill="#f4f8fd" stroke="#426b99" stroke-width="1.5"/>
    <text x="45" y="278" font-size="16" font-weight="bold">Application level, inside the same clinic application</text>
    <rect x="50" y="295" width="230" height="65" rx="4" fill="white" stroke="#333"/>
    <text x="165" y="333" text-anchor="middle" font-size="16">Web controller</text>
    <rect x="365" y="295" width="230" height="65" rx="4" fill="white" stroke="#333"/>
    <text x="480" y="333" text-anchor="middle" font-size="16">Booking operation</text>
    <rect x="680" y="295" width="230" height="65" rx="4" fill="white" stroke="#333"/>
    <text x="795" y="333" text-anchor="middle" font-size="16">Persistence adapter</text>
    <path d="M280 327 L365 327" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="322.5" y="317" text-anchor="middle" font-size="13">call</text>
    <path d="M595 327 L680 327" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="637.5" y="317" text-anchor="middle" font-size="13">call</text>

    <text x="24" y="414" font-size="14">Solid arrows represent runtime interactions. The dashed arrow indicates a closer view.</text>
  </g>
</svg>
