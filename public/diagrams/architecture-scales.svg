<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">One operation, two architectural scales</title><desc id="desc">The browser calls an application. Inside, a controller calls a booking use case and persistence adapter. Proposed application design.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker></defs>
<rect width="960" height="440" fill="white"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#111">
<text x="24" y="30" font-size="20" font-weight="bold">One operation, two architectural scales</text>
<rect x="25" y="80" width="170" height="70" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="110.0" y="106" text-anchor="middle">Browser</text>
<rect x="285" y="80" width="610" height="70" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="590.0" y="106" text-anchor="middle">One deployed clinic application</text>
<rect x="25" y="205" width="910" height="125" rx="6" fill="#f4f8fd" stroke="#426b99" stroke-width="1.5"/>
<text x="45" y="225" font-weight="bold">Inside the same clinic application</text>
<rect x="50" y="235" width="230" height="70" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="165.0" y="261" text-anchor="middle">Web controller</text>
<rect x="365" y="235" width="230" height="70" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="480.0" y="261" text-anchor="middle">Booking use case</text>
<rect x="680" y="235" width="230" height="70" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="795.0" y="261" text-anchor="middle">Persistence adapter</text>
<path d="M195 115 L285 115" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="240.0" y="105.0" text-anchor="middle" font-size="14">HTTP</text>
<path d="M590 150 L480 205" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="535.0" y="182.5" text-anchor="middle" font-size="14">zoom inside</text>
<path d="M280 270 L365 270" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="322.5" y="260.0" text-anchor="middle" font-size="14">call</text>
<path d="M595 270 L680 270" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="637.5" y="260.0" text-anchor="middle" font-size="14">call</text>
<text x="24" y="396" font-size="14">Solid arrows show runtime calls. The dashed arrow zooms into the application.</text>
<text x="24" y="418" font-size="14">The original PetClinic does not contain the proposed booking use-case class.</text>
</g></svg>
