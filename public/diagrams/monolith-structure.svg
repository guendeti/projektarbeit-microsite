<rect x="240" y="55" width="680" height="450" rx="4" fill="none" stroke="#333" stroke-width="2"/>
<text x="260" y="82">Spring Boot application released as one unit</text>
<g fill="#f7f7f7" stroke="#333">
<rect x="25" y="105" width="165" height="70" rx="4"/>
