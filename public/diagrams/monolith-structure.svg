<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-labelledby="title desc">
  <title id="title">One Spring PetClinic instance with PostgreSQL</title>
  <desc id="desc">The browser sends HTTP requests to an application that handles owners, pets and visits and provides the vet directory. This instance accesses PostgreSQL in a separate process.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#24364a"/>
    </marker>
  </defs>
  <rect width="800" height="240" fill="white"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#172638">
    <rect x="16" y="100" width="108" height="52" rx="5" fill="#f7f7f7" stroke="#42566b"/>
    <text x="70" y="132" font-size="17">Browser</text>
    <rect x="213" y="20" width="354" height="200" rx="6" fill="white" stroke="#42566b" stroke-width="2"/>
    <text x="390" y="54" font-size="19" font-weight="bold">Spring PetClinic</text>
    <text x="390" y="78" font-size="16">One application instance</text>
    <rect x="235" y="96" width="310" height="43" rx="5" fill="#fff5dc" stroke="#42566b"/>
    <text x="390" y="123" font-size="17">Owners, pets and visits</text>
    <rect x="235" y="153" width="310" height="43" rx="5" fill="#fff5dc" stroke="#42566b"/>
    <text x="390" y="180" font-size="17">Vet directory</text>
    <rect x="647" y="100" width="135" height="52" rx="5" fill="#eaf2fb" stroke="#42566b"/>
    <text x="714" y="132" font-size="17">PostgreSQL</text>
    <path d="M124 126 H212" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M567 126 H646" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="168" y="115" font-size="15">HTTP</text>
    <text x="607" y="115" font-size="15">SQL</text>
  </g>
</svg>
