<svg xmlns="http://www.w3.org/2000/svg" width="960" height="665" viewBox="0 0 960 665" role="img" aria-labelledby="title desc">
<title id="title">Original PetClinic in one application</title>
<desc id="desc">Browser uses MVC controllers and Thymeleaf. Owner Pet Visit and Vet entities plus repositories share one Spring Boot application. Database can be embedded or external.</desc>
