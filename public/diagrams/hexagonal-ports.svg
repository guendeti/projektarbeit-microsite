<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Visit booking through ports and adapters</title><desc id="desc">The application boundary encloses BookVisit, BookingVisit, VisitDetails and VisitStore. MVC, terminal and test callers are outside. Storage adapters and the supplied Clock are outside. Solid arrows show calls; the dashed arrow shows the adapter depending on its port.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#24364a"/></marker></defs>
<rect width="1120" height="620" fill="white"/>
<g font-family="Arial, sans-serif" fill="#172638">
<text x="24" y="32" font-size="22" text-anchor="start" font-weight="bold">Visit booking through ports and adapters</text>
<rect x="330" y="75" width="460" height="445" rx="8" fill="#f4f8fd" stroke="#426b99" stroke-width="2"/>
<text x="346" y="100" font-size="16" text-anchor="start" font-weight="bold">Application boundary</text>
<rect x="20" y="150" width="260" height="105" rx="5" fill="#f5f7f9" stroke="#42566b" stroke-width="1.5"/>
<text x="150.0" y="196.5" font-size="16" text-anchor="middle">Driving adapters</text>
<text x="150.0" y="220.5" font-size="16" text-anchor="middle">Web / terminal / test</text>
<rect x="360" y="150" width="170" height="95" rx="5" fill="#ffffff" stroke="#42566b" stroke-width="1.5"/>
<text x="445.0" y="191.5" font-size="16" text-anchor="middle">Input port</text>
<text x="445.0" y="215.5" font-size="16" text-anchor="middle">BookVisit</text>
<rect x="590" y="150" width="170" height="95" rx="5" fill="#ffffff" stroke="#42566b" stroke-width="1.5"/>
<text x="675.0" y="191.5" font-size="16" text-anchor="middle">Output port</text>
<text x="675.0" y="215.5" font-size="16" text-anchor="middle">VisitStore</text>
<rect x="450" y="290" width="220" height="85" rx="5" fill="#eaf2fb" stroke="#42566b" stroke-width="1.5"/>
<text x="560.0" y="326.5" font-size="16" text-anchor="middle">Use case</text>
<text x="560.0" y="350.5" font-size="16" text-anchor="middle">BookingVisit</text>
<rect x="390" y="425" width="340" height="65" rx="5" fill="#eaf2fb" stroke="#42566b" stroke-width="1.5"/>
<text x="560.0" y="463.5" font-size="16" text-anchor="middle">VisitDetails, booking values and policy</text>
<rect x="840" y="150" width="260" height="105" rx="5" fill="#f5f7f9" stroke="#42566b" stroke-width="1.5"/>
<text x="970.0" y="196.5" font-size="16" text-anchor="middle">Driven adapters</text>
<text x="970.0" y="220.5" font-size="16" text-anchor="middle">JpaVisitStore / test fake</text>
<rect x="840" y="410" width="260" height="85" rx="5" fill="#f5f7f9" stroke="#42566b" stroke-width="1.5"/>
<text x="970.0" y="446.5" font-size="16" text-anchor="middle">Supplied time source</text>
<text x="970.0" y="470.5" font-size="16" text-anchor="middle">java.time.Clock</text>
<path d="M280 180 H360" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="320" y="167" font-size="14" text-anchor="middle">book</text>
<path d="M445 245 L500 290" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="435" y="278" font-size="14" text-anchor="middle">dispatch</text>
<path d="M620 290 L675 245" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="702" y="278" font-size="14" text-anchor="middle">append</text>
<path d="M760 180 H840" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="800" y="167" font-size="14" text-anchor="middle">runtime call</text>
<path d="M840 225 H760" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="800" y="214" font-size="14" text-anchor="middle">implements</text>
<path d="M560 375 V425" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="600" y="407" font-size="14" text-anchor="middle">validate</text>
<path d="M670 335 H810 V452 H840" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="750" y="322" font-size="14" text-anchor="middle">read clinic date</text>
<text x="24" y="578" font-size="14" text-anchor="start">Solid arrows show runtime calls. The dashed arrow shows a source dependency on the output port.</text>
<text x="24" y="600" font-size="14" text-anchor="start">Blue areas belong to the application. Clock is a standard Java abstraction, supplied by configuration.</text>
</g></svg>
