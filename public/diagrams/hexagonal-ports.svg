<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Booking a visit through ports and adapters</title>
  <desc id="desc">A hexagon contains the application with BookVisitInteractor and the booking rules. On its left edge is the driving port BookVisitUseCase, used by two driving adapters, the web controller and a test. On its right edge is the driven port VisitStore, implemented by two driven adapters, the JPA adapter and an in-memory adapter for tests.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#24364a"/>
    </marker>
    <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="white" stroke="#24364a" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#172638">
    <text x="24" y="32" font-size="20" font-weight="bold">Booking a visit through ports and adapters</text>

    <polygon points="300,290 400,120 600,120 700,290 600,460 400,460" fill="#fffaf0" stroke="#8a6d1f" stroke-width="2"/>
    <text x="500" y="165" font-size="16" text-anchor="middle" font-weight="bold">Application</text>
    <text x="500" y="190" font-size="15" text-anchor="middle">BookVisitInteractor</text>
    <text x="500" y="390" font-size="14" text-anchor="middle">date and ownership rules</text>

    <rect x="270" y="255" width="160" height="70" rx="5" fill="#fff5dc" stroke="#42566b" stroke-width="1.5"/>
    <text x="350" y="284" font-size="15" text-anchor="middle" font-weight="bold">BookVisitUseCase</text>
    <text x="350" y="306" font-size="13" text-anchor="middle">driving port</text>

    <rect x="570" y="255" width="160" height="70" rx="5" fill="#fff5dc" stroke="#42566b" stroke-width="1.5"/>
    <text x="650" y="284" font-size="15" text-anchor="middle" font-weight="bold">VisitStore</text>
    <text x="650" y="306" font-size="13" text-anchor="middle">driven port</text>

    <rect x="20" y="140" width="210" height="70" rx="5" fill="#eaf2fb" stroke="#42566b" stroke-width="1.5"/>
    <text x="125" y="170" font-size="15" text-anchor="middle" font-weight="bold">CleanVisitController</text>
    <text x="125" y="192" font-size="13" text-anchor="middle">web, driving adapter</text>

    <rect x="20" y="370" width="210" height="70" rx="5" fill="#eaf2fb" stroke="#42566b" stroke-width="1.5"/>
    <text x="125" y="400" font-size="15" text-anchor="middle" font-weight="bold">BookVisitInteractorTests</text>
    <text x="125" y="422" font-size="13" text-anchor="middle">test, driving adapter</text>

    <rect x="770" y="140" width="210" height="70" rx="5" fill="#eaf2fb" stroke="#42566b" stroke-width="1.5"/>
    <text x="875" y="170" font-size="15" text-anchor="middle" font-weight="bold">JpaVisitStore</text>
    <text x="875" y="192" font-size="13" text-anchor="middle">database, driven adapter</text>

    <rect x="770" y="370" width="210" height="70" rx="5" fill="#eaf2fb" stroke="#42566b" stroke-width="1.5"/>
    <text x="875" y="400" font-size="15" text-anchor="middle" font-weight="bold">InMemoryVisitStore</text>
    <text x="875" y="422" font-size="13" text-anchor="middle">test, driven adapter</text>

    <g fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M230 185 L290 255"/>
      <path d="M230 395 L290 325"/>
    </g>
    <g fill="none" stroke="#24364a" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#hollow)">
      <path d="M770 185 L710 255"/>
      <path d="M770 395 L710 325"/>
    </g>

    <text x="24" y="510" font-size="14">Solid arrows mean “calls”. Dashed arrows mean “implements”. Both point to interfaces in the booking core.</text>
    <text x="24" y="532" font-size="14">During a booking, the interactor calls the selected store through VisitStore.</text>
    <text x="24" y="554" font-size="14">The top pair handles web bookings. The bottom pair runs the same use case in a test.</text>
    <text x="24" y="576" font-size="14">Form display uses a separate lookup through OwnerRepository.</text>
  </g>
</svg>
