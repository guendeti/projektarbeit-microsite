<svg xmlns="http://www.w3.org/2000/svg" width="960" height="405" viewBox="0 0 960 405" role="img" aria-labelledby="title desc">
<title id="title">Gateway flow for combining Owner details</title><desc id="desc">Gateway calls Customers Retrieve Owner and Pet identifiers Gateway calls Visits Retrieve Visits for the Pet identifiers Gateway combines results Visits lookup failure uses empty-list fallback</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker></defs>
<rect width="960" height="405" fill="white"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#111">
<text x="24" y="30" font-size="20" font-weight="bold">Gateway flow for combining Owner details</text>
<rect x="40" y="65" width="880" height="65" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="480.0" y="91" text-anchor="middle">1. Gateway calls Customers</text>
<text x="480.0" y="114" text-anchor="middle">Retrieve Owner and Pet identifiers</text>
<rect x="40" y="155" width="880" height="65" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="480.0" y="181" text-anchor="middle">2. Gateway calls Visits</text>
<text x="480.0" y="204" text-anchor="middle">Retrieve Visits for the Pet identifiers</text>
<rect x="40" y="245" width="880" height="65" rx="4" fill="#f7f7f7" stroke="#333"/>
<text x="480.0" y="271" text-anchor="middle">3. Gateway combines results</text>
<text x="480.0" y="294" text-anchor="middle">Visits lookup failure uses empty-list fallback</text>
<path d="M480 130 L480 155" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480 220 L480 245" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="24" y="361" font-size="14">Runtime request order. Customers does not call Visits in this diagram.</text>
<text x="24" y="383" font-size="14">A fallback empty list does not establish that no visits exist.</text>
</g></svg>
