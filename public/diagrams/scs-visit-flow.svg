<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">SCS booking commits locally, then proceeds independently</title><desc id="desc">A local transaction stores Visit and outbox record. After commit, the response and event publication are independent branches. Delivery can finish before or after the HTTP response.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#24364a"/></marker></defs>
<rect width="1120" height="650" fill="white"/>
<g font-family="Arial, sans-serif" fill="#172638">
<text x="24" y="32" font-size="22" text-anchor="start" font-weight="bold">SCS booking commits locally, then proceeds independently</text>
<rect x="190" y="75" width="740" height="75" rx="5" fill="#f5f7f9" stroke="#42566b" stroke-width="1.5"/>
<text x="560.0" y="106.5" font-size="16" text-anchor="middle">1. Visits receives booking input</text>
<text x="560.0" y="130.5" font-size="16" text-anchor="middle">Validate input and locally known pet information</text>
<rect x="190" y="210" width="740" height="85" rx="5" fill="#edf5ef" stroke="#42566b" stroke-width="1.5"/>
<text x="560.0" y="246.5" font-size="16" text-anchor="middle">2. Commit one local transaction</text>
<text x="560.0" y="270.5" font-size="16" text-anchor="middle">Store the Visit and the outgoing event record together</text>
<rect x="25" y="375" width="500" height="80" rx="5" fill="#f5f7f9" stroke="#42566b" stroke-width="1.5"/>
<text x="275.0" y="409.0" font-size="16" text-anchor="middle">Return booking confirmation</text>
<text x="275.0" y="433.0" font-size="16" text-anchor="middle">No wait for a remote system</text>
<rect x="595" y="375" width="500" height="80" rx="5" fill="#f5f7f9" stroke="#42566b" stroke-width="1.5"/>
<text x="845.0" y="409.0" font-size="16" text-anchor="middle">Relay publishes the committed outbox event</text>
<text x="845.0" y="433.0" font-size="16" text-anchor="middle">Retry delivery if necessary</text>
<rect x="595" y="505" width="500" height="70" rx="5" fill="#f5f7f9" stroke="#42566b" stroke-width="1.5"/>
<text x="845.0" y="534.0" font-size="16" text-anchor="middle">Receivers process the event</text>
<text x="845.0" y="558.0" font-size="16" text-anchor="middle">Handle duplicates and update local views</text>
<path d="M560 150 V210" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M560 295 V335 H275 V375" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M560 295 V335 H845 V375" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="560" y="326" font-size="14" text-anchor="middle">after successful commit</text>
<path d="M845 455 V505" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="24" y="608" font-size="14" text-anchor="start">The two post-commit branches are independent. No ordering between response and publication is guaranteed.</text>
<text x="24" y="630" font-size="14" text-anchor="start">This is a proposed design. Unknown pets are deferred; failed, missing or out-of-order delivery needs recovery.</text>
</g></svg>
