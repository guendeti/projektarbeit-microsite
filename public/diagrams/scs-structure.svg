<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
<title id="title">Each SCS owns its interface, logic and data</title><desc id="desc">Proposed pet clinic systems: Owners, Visits and Vets. Visits owns its Visit records and a local copy of pet data. Links navigate between systems, and events update the copy.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#24364a"/></marker></defs>
<rect width="1120" height="350" fill="white"/>
<g font-family="Arial, sans-serif" fill="#172638">
<text x="24" y="32" font-size="22" text-anchor="start" font-weight="bold">Each SCS owns its interface, logic and data</text>
<rect x="20" y="70" width="300" height="215" rx="5" fill="#edf5ef" stroke="#42566b" stroke-width="1.5"/>
<text x="170.0" y="123" font-size="18" font-weight="bold" text-anchor="middle">Owners</text>
<text x="170.0" y="211.0" font-size="16" text-anchor="middle">Owner and pet pages</text>
<text x="170.0" y="235.0" font-size="16" text-anchor="middle">Manages owner and pet records</text>
<rect x="410" y="70" width="300" height="215" rx="5" fill="#edf5ef" stroke="#42566b" stroke-width="1.5"/>
<text x="560.0" y="123" font-size="18" font-weight="bold" text-anchor="middle">Visits</text>
<text x="560.0" y="199.0" font-size="16" text-anchor="middle">Booking form and rules</text>
<text x="560.0" y="223.0" font-size="16" text-anchor="middle">Saves visit records</text>
<text x="560.0" y="247.0" font-size="16" text-anchor="middle">Checks its local copy of pet details</text>
<rect x="800" y="70" width="300" height="215" rx="5" fill="#edf5ef" stroke="#42566b" stroke-width="1.5"/>
<text x="950.0" y="123" font-size="18" font-weight="bold" text-anchor="middle">Vets</text>
<text x="950.0" y="211.0" font-size="16" text-anchor="middle">Vet directory pages</text>
<text x="950.0" y="235.0" font-size="16" text-anchor="middle">Manages vet records</text>
<path d="M320 160 H410" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="365" y="146" font-size="14" text-anchor="middle">Add Visit link</text>
<path d="M320 255 H410" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="365" y="242" font-size="14" text-anchor="middle">PetChanged</text>
<text x="24" y="312" font-size="14" text-anchor="start">The browser follows the solid arrow to open the booking form. Owners sends pet updates separately along the dashed arrow.</text>
<text x="24" y="334" font-size="14" text-anchor="start">Each box shows the pages, logic and data owned by one team.</text>
</g></svg>
