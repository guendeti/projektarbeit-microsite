<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
<title id="title">Each SCS owns its interface, logic and data</title><desc id="desc">Proposed Owners and Pets, Visits and Vets systems. Visits owns its Visit records and a local projection of pet information. Links navigate between systems; events update the projection.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#24364a"/></marker></defs>
<rect width="1120" height="450" fill="white"/>
<g font-family="Arial, sans-serif" fill="#172638">
<text x="24" y="32" font-size="22" text-anchor="start" font-weight="bold">Each SCS owns its interface, logic and data</text>
<rect x="20" y="100" width="300" height="210" rx="5" fill="#edf5ef" stroke="#42566b" stroke-width="1.5"/>
<text x="170.0" y="187.0" font-size="16" text-anchor="middle">Owners and Pets SCS</text>
<text x="170.0" y="211.0" font-size="16" text-anchor="middle">Own UI and business logic</text>
<text x="170.0" y="235.0" font-size="16" text-anchor="middle">Authoritative Owner/Pet records</text>
<rect x="410" y="100" width="300" height="210" rx="5" fill="#edf5ef" stroke="#42566b" stroke-width="1.5"/>
<text x="560.0" y="175.0" font-size="16" text-anchor="middle">Visits SCS</text>
<text x="560.0" y="199.0" font-size="16" text-anchor="middle">Own UI and booking logic</text>
<text x="560.0" y="223.0" font-size="16" text-anchor="middle">Own Visit records</text>
<text x="560.0" y="247.0" font-size="16" text-anchor="middle">Local Pet projection</text>
<rect x="800" y="100" width="300" height="210" rx="5" fill="#edf5ef" stroke="#42566b" stroke-width="1.5"/>
<text x="950.0" y="187.0" font-size="16" text-anchor="middle">Vets SCS</text>
<text x="950.0" y="211.0" font-size="16" text-anchor="middle">Own UI and business logic</text>
<text x="950.0" y="235.0" font-size="16" text-anchor="middle">Own Vet records</text>
<path d="M320 160 H410" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="365" y="146" font-size="14" text-anchor="middle">UI link</text>
<path d="M320 255 H410" fill="none" stroke="#24364a" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="365" y="242" font-size="14" text-anchor="middle">Pet events</text>
<text x="24" y="408" font-size="14" text-anchor="start">The solid arrow is browser navigation. The dashed arrow is deferred event delivery into a local projection.</text>
<text x="24" y="430" font-size="14" text-anchor="start">Each box is a logical ownership boundary, not a claim about physical server placement.</text>
</g></svg>
